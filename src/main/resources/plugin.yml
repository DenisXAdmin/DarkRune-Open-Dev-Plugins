name: DarkRuneTab
version: '${project.version}'
main: org.darkrune.dev.DarkRuneTab
api-version: '1.21'
author: DarkRune Dev
description: High-performance Tab List plugin for Paper 1.21+

folia-supported: true

softdepend:
  - LuckPerms
  - PlaceholderAPI

commands:
  darkrunetab:
    description: Main command for DarkRune Tab
    usage: /darkrunetab [reload|toggle|debug|help]
    aliases: [dtab, tab]

permissions:
  darkrunetab.use:
    description: Basic access to the plugin
    default: true
  darkrunetab.reload:
    description: Reload configurations
    default: op
  darkrunetab.toggle:
    description: Toggle modules
    default: op
  darkrunetab.debug:
    description: Debug commands
    default: op